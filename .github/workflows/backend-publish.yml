name: Backend Publish

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      parent_ref:
        required: false
        type: string
        default: master
      version:
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.repository }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout service
        uses: actions/checkout@v6
        with:
          path: ${{ inputs.module }}

      - name: Checkout parent POM
        uses: actions/checkout@v6
        with:
          repository: Sergio-Smirnoff/financial-app-back-financial-app-parent
          ref: ${{ inputs.parent_ref }}
          path: financial-app-parent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
