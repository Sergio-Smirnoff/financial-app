name: Backend CI

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      parent_ref:
        required: false
        type: string
        default: master

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.module }}

      - name: Checkout parent POM
        uses: actions/checkout@v4
        with:
          repository: Sergio-Smirnoff/financial-app-back-financial-app-parent
          ref: ${{ inputs.parent_ref }}
          path: financial-app-parent

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install parent BOM + commons
        run: mvn -f financial-app-parent/pom.xml -B -DskipTests install

      - name: Test service
        run: mvn -f ${{ inputs.module }}/pom.xml -B verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.module }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
