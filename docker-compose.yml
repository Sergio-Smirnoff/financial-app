services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  traefik:
    profiles: [app]
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - internal
    restart: unless-stopped

  duckdns:
    profiles: [app]
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - SUBDOMAINS=${DUCKDNS_DOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - internal
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - internal
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    restart: unless-stopped

  # ─── Application services (profile: app) ─────────────────────────────────────

  gateway:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-gateway:latest
    container_name: gateway
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      FINANCES_SERVICE_URL: ${FINANCES_SERVICE_URL}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL}
      UPLOAD_SERVICE_URL: ${UPLOAD_SERVICE_URL}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - service-users
      - service-finances
      - service-banks
      - service-notifications
      - service-upload
      - service-investments
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=myresolver"
    restart: unless-stopped

  service-users:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-users:latest
    container_name: service-users
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
    networks:
      - internal
    restart: unless-stopped

  service-finances:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-finances:latest
    container_name: service-finances
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
    networks:
      - internal
    restart: unless-stopped

  service-banks:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-banks:latest
    container_name: service-banks
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=banks
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
    networks:
      - internal
    restart: unless-stopped

  service-notifications:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-notifications:latest
    container_name: service-notifications
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_SCHEDULER_CRON: ${NOTIFICATION_SCHEDULER_CRON}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  service-upload:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-upload:latest
    container_name: service-upload
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_STATEMENTS: ${MINIO_BUCKET_STATEMENTS}
      MINIO_BUCKET_RECEIPTS: ${MINIO_BUCKET_RECEIPTS}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
      - minio
    networks:
      - internal
    restart: unless-stopped

  service-investments:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-investments:latest
    container_name: service-investments
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=investments
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      IOL_USERNAME: ${IOL_USERNAME}
      IOL_PASSWORD: ${IOL_PASSWORD}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
    deploy:
      resources:
        limits:
          memory: 350M
    depends_on:
      - postgres
      - kafka
    networks:
      - internal
    restart: unless-stopped

  frontend:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-front-financial-app:latest
    container_name: frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
    depends_on:
      - gateway
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  letsencrypt:

networks:
  internal:
    driver: bridge
