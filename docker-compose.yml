# =============================================================================
# docker-compose.yml — CANONICAL PRODUCTION stack
# =============================================================================
# Prod:  docker compose -f docker-compose.yml --profile app up -d
#        (no host ports are published at all; routing/TLS live in the separate
#         edge stack). A plain `docker compose up` is the same shape — the dev
#         overlay is opt-in, never auto-loaded.
# Dev:   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile app up -d
#        (docker-compose.dev.yml => host ports exposed per-ms; scripts/dev.sh
#         sets COMPOSE_FILE so its plain calls get the overlay)
#
# Monitoring (prometheus/grafana/loki/promtail) has NO profile => always up.
# Infra (postgres/kafka/minio) has NO profile => always up.
# App (gateway/services/frontend) is gated behind profile `app`.
# =============================================================================

x-java-opts: &java-opts "-Xmx512m -Xms256m -XX:ActiveProcessorCount=2"

x-spring-service: &spring-base
  profiles: [app]
  restart: unless-stopped
  depends_on: [postgres, kafka]
  deploy:
    resources:
      limits:
        memory: 768M

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - finance_data
      - link_backup_finance_pg
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finance_data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - finance_data
      - link_backup_finance_minio
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ─── Application services (profile: app) ─────────────────────────────────────

  gateway:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-gateway/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-gateway:${GATEWAY_VERSION:-latest}
    container_name: gateway
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      JWT_SECRET: ${JWT_SECRET}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      FINANCES_SERVICE_URL: ${FINANCES_SERVICE_URL}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL}
      UPLOAD_SERVICE_URL: ${UPLOAD_SERVICE_URL}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}
      # Derived from DOMAIN_NAME plus the optional SECONDARY_DOMAIN_NAME so both
      # hostnames are accepted during a domain migration. Composed here rather
      # than in .env because .env interpolation is order-dependent and
      # ALLOWED_ORIGINS is declared above DOMAIN_NAME there. Setting
      # ALLOWED_ORIGINS explicitly in .env still overrides this.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN_NAME}${SECONDARY_DOMAIN_NAME:+,https://${SECONDARY_DOMAIN_NAME}},http://localhost}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
    depends_on:
      - service-users
      - service-finances
      - service-banks
      - service-notifications
      - service-upload
      - service-investments
    networks:
      - front_finance
      - finance_data

  service-users:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-users/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-users:${USERS_VERSION:-latest}
    container_name: service-users
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - finance_data

  service-finances:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-finances/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-finances:${FINANCES_VERSION:-latest}
    container_name: service-finances
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
    networks:
      - finance_data

  service-banks:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-banks/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-banks:${BANKS_VERSION:-latest}
    container_name: service-banks
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=banks
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}
    networks:
      - finance_data

  service-notifications:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-notifications/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-notifications:${NOTIFICATIONS_VERSION:-latest}
    container_name: service-notifications
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_SCHEDULER_CRON: ${NOTIFICATION_SCHEDULER_CRON}
    # D21: on egress (external SMTP) AND finance_data, so peers must use the
    # -int alias — the bare name can resolve to the icc-blocked egress address.
    networks:
      finance_data:
        aliases: [service-notifications-int]
      egress: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  service-upload:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-upload/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-upload:${UPLOAD_VERSION:-latest}
    container_name: service-upload
    depends_on:
      - postgres
      - kafka
      - minio
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_STATEMENTS: ${MINIO_BUCKET_STATEMENTS}
      MINIO_BUCKET_RECEIPTS: ${MINIO_BUCKET_RECEIPTS}
    networks:
      - finance_data

  service-investments:
    <<: *spring-base
    build:
      context: ./back
      dockerfile: ms-investments/Dockerfile
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-investments:${INVESTMENTS_VERSION:-latest}
    container_name: service-investments
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=investments
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      IOL_USERNAME: ${IOL_USERNAME}
      IOL_PASSWORD: ${IOL_PASSWORD}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
      FINANCES_SERVICE_URL: ${FINANCES_SERVICE_URL}
    # D21: on egress (IOL + FX price APIs) AND finance_data, so peers must use
    # the -int alias — the bare name can resolve to the icc-blocked egress address.
    networks:
      finance_data:
        aliases: [service-investments-int]
      egress: {}

  frontend:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-front-financial-app:${FRONTEND_VERSION:-latest}
    container_name: frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - gateway
    networks:
      - front_finance
      - finance_data
    restart: unless-stopped

  # ─── Monitoring (no profile → always up) ─────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
    # D21: on egress (host node-exporter at 10.0.250.1) AND finance_data, so
    # grafana must use the -int alias — the bare name can resolve to the
    # icc-blocked egress address.
    networks:
      finance_data:
        aliases: [prometheus-int]
      egress: {}
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # Sub-path serving stays on: it makes Grafana emit root-relative asset
      # URLs, so /grafana works on every hostname the edge routes here. Only
      # Grafana's own absolute links follow the host below, hence the override.
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://${DOMAIN_NAME}/grafana}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - front_finance
      - finance_data
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - finance_data
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - finance_data
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

# Phase 20 network boundary (homelab-infra). finance_data is this stack's own
# backend network and is created HERE (name: pinned so it is not prefixed with
# the project name). The other four are created by homelab-infra — front_finance
# and egress by its `edge` stack, the link_backup_* pair by its `backups` stack —
# so those stacks must be up before this one. See infra/NETWORKS.md.
networks:
  front_finance:
    external: true
  finance_data:
    name: finance_data
    internal: true
    ipam:
      config:
        - subnet: 10.0.61.0/24
  egress:
    external: true
  link_backup_finance_pg:
    external: true
  link_backup_finance_minio:
    external: true
