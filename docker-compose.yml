# =============================================================================
# docker-compose.yml — CANONICAL PRODUCTION stack
# =============================================================================
# Prod:  docker compose -f docker-compose.yml --profile app up -d
#        (explicit -f => docker-compose.override.yml is NOT loaded => no host
#         ports are published except Traefik 80/443)
# Dev:   docker compose --profile app up -d
#        (docker-compose.override.yml auto-loads => host ports exposed per-ms)
#
# Monitoring (prometheus/grafana/loki/promtail) has NO profile => always up.
# Infra (postgres/kafka/minio) has NO profile => always up.
# App (gateway/services/frontend/traefik/duckdns) is gated behind profile `app`.
# =============================================================================

x-java-opts: &java-opts "-Xmx512m -Xms256m -XX:ActiveProcessorCount=2"

x-spring-service: &spring-base
  profiles: [app]
  restart: unless-stopped
  networks: [internal]
  depends_on: [postgres, kafka]
  deploy:
    resources:
      limits:
        memory: 768M

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  traefik:
    profiles: [app]
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    networks:
      - internal
    restart: unless-stopped

  duckdns:
    profiles: [app]
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - SUBDOMAINS=${DUCKDNS_DOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - internal
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ─── Application services (profile: app) ─────────────────────────────────────

  gateway:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-gateway:${GATEWAY_VERSION:-latest}
    container_name: gateway
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      JWT_SECRET: ${JWT_SECRET}
      JWT_ENABLED: ${JWT_ENABLED:-true}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL}
      FINANCES_SERVICE_URL: ${FINANCES_SERVICE_URL}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL}
      UPLOAD_SERVICE_URL: ${UPLOAD_SERVICE_URL}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
    depends_on:
      - service-users
      - service-finances
      - service-banks
      - service-notifications
      - service-upload
      - service-investments
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
      # API
      - "traefik.http.routers.gateway.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=myresolver"
      - "traefik.http.routers.gateway.service=gateway"
      # Swagger (basic-auth)
      - "traefik.http.routers.swagger.rule=Host(`${DOMAIN_NAME}`) && (PathPrefix(`/swagger-ui`) || Path(`/swagger-ui.html`) || PathPrefix(`/v3/api-docs`))"
      - "traefik.http.routers.swagger.entrypoints=websecure"
      - "traefik.http.routers.swagger.tls.certresolver=myresolver"
      - "traefik.http.routers.swagger.service=gateway"
      - "traefik.http.routers.swagger.middlewares=swagger-auth"
      - "traefik.http.middlewares.swagger-auth.basicauth.users=${SWAGGER_AUTH}"

  service-users:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-users:${USERS_VERSION:-latest}
    container_name: service-users
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  service-finances:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-finances:${FINANCES_VERSION:-latest}
    container_name: service-finances
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}

  service-banks:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-banks:${BANKS_VERSION:-latest}
    container_name: service-banks
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=banks
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      INVESTMENTS_SERVICE_URL: ${INVESTMENTS_SERVICE_URL}

  service-notifications:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-notifications:${NOTIFICATIONS_VERSION:-latest}
    container_name: service-notifications
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      NOTIFICATION_SCHEDULER_CRON: ${NOTIFICATION_SCHEDULER_CRON}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  service-upload:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-upload:${UPLOAD_VERSION:-latest}
    container_name: service-upload
    depends_on:
      - postgres
      - kafka
      - minio
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_STATEMENTS: ${MINIO_BUCKET_STATEMENTS}
      MINIO_BUCKET_RECEIPTS: ${MINIO_BUCKET_RECEIPTS}

  service-investments:
    <<: *spring-base
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-investments:${INVESTMENTS_VERSION:-latest}
    container_name: service-investments
    environment:
      JAVA_TOOL_OPTIONS: *java-opts
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=investments
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      IOL_USERNAME: ${IOL_USERNAME}
      IOL_PASSWORD: ${IOL_PASSWORD}
      BANKS_SERVICE_URL: ${BANKS_SERVICE_URL}

  frontend:
    profiles: [app]
    image: ghcr.io/sergio-smirnoff/financial-app-front-financial-app:${FRONTEND_VERSION:-latest}
    container_name: frontend
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - gateway
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
    restart: unless-stopped

  # ─── Monitoring (no profile → always up) ─────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN_NAME}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  letsencrypt:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  internal:
    driver: bridge
