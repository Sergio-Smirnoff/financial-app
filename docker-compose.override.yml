# =============================================================================
# docker-compose.override.yml — DEVELOPMENT overlay (auto-loaded)
# =============================================================================
# Docker Compose loads this automatically with the default `docker compose` cmd.
# It ONLY publishes host ports for local development.
#
# PRODUCTION must bypass this file by passing -f explicitly:
#   docker compose -f docker-compose.yml --profile app up -d
#
# Dev (ports exposed):
#   docker compose --profile app up -d
#
# Swagger UIs (dev, direct to each service):
#   Users 8081 · Finances 8082 · Banks 8083 · Notifications 8084 ·
#   Upload 8085 · Investments 8086  →  http://localhost:<port>/swagger-ui.html
# Monitoring (dev): Prometheus 9090 · Grafana 3001 · Loki 3100
# =============================================================================

services:
  traefik:
    ports:
      - "8888:8080"

  postgres:
    ports:
      - "5432:5432"

  kafka:
    ports:
      - "9093:9093"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  gateway:
    ports:
      - "8080:8080"

  frontend:
    ports:
      - "3000:3000"

  service-users:
    ports:
      - "8081:8081"

  service-finances:
    ports:
      - "8082:8082"

  service-banks:
    ports:
      - "8083:8083"

  service-notifications:
    ports:
      - "8084:8084"

  service-upload:
    ports:
      - "8085:8085"

  service-investments:
    ports:
      - "8086:8086"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"

  loki:
    ports:
      - "3100:3100"
