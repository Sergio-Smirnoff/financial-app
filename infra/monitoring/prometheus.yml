global:
  scrape_interval: 30s

scrape_configs:
  # service-notifications and service-investments sit on egress + finance_data,
  # so they are scraped by their -int alias (D21, see infra/NETWORKS.md).
  - job_name: 'financial-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'service-users:8081'
          - 'service-finances:8082'
          - 'service-banks:8083'
          - 'service-notifications-int:8084'
          - 'service-upload:8085'
          - 'service-investments-int:8086'

  - job_name: 'node'
    static_configs:
      - targets: ['10.0.250.1:9100']   # node-exporter binds the homelab egress gateway (homelab-infra stacks/dashboard)
