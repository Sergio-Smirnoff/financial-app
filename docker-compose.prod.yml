# docker-compose.prod.yml — pinned production image tags.
# Use WITH the base file: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app ...
services:
  gateway:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-gateway:1.1.0
  service-users:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-users:1.1.0
  service-finances:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-finances:1.1.0
  service-banks:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-banks:1.1.0
  service-notifications:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-notifications:1.1.0
  service-upload:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-upload:0.2.0
  service-investments:
    image: ghcr.io/sergio-smirnoff/financial-app-back-ms-investments:1.1.0
  frontend:
    image: ghcr.io/sergio-smirnoff/financial-app-front-financial-app:1.1.0
  # Prod traefik: file-provider routing (infra/traefik/dynamic.yml) on v3.3.
  # Overrides the base docker-label provider so Grafana + Swagger are routed too.
  traefik:
    image: traefik:v3.3
    command:
      - "--api.insecure=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    volumes:
      - "./infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
