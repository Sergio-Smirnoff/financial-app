# =============================================================================
# docker-compose.dev.yml — DEVELOPMENT overlay (opt-in, NOT auto-loaded)
# =============================================================================
# Publishes host ports for local development only. It is deliberately NOT
# named docker-compose.override.yml: the auto-loaded override was applied on
# the production server twice (2026-08-26, 2026-09-01) and its 9090/3001
# publishes collided with Cockpit and Uptime Kuma, leaving prometheus and
# grafana in state `created`.
#
# Production (no host ports):
#   docker compose -f docker-compose.yml --profile app up -d
#
# Dev (ports exposed):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile app up -d
#
# Swagger UIs (dev, direct to each service):
#   Users 8081 · Finances 8082 · Banks 8083 · Notifications 8084 ·
#   Upload 8085 · Investments 8086  →  http://localhost:<port>/swagger-ui.html
# Monitoring (dev): Prometheus 9090 · Grafana 3001 · Loki 3100
# =============================================================================

services:
  postgres:
    ports:
      - "5432:5432"

  kafka:
    ports:
      - "9093:9093"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  gateway:
    ports:
      - "8080:8080"

  frontend:
    ports:
      - "3000:3000"

  service-users:
    ports:
      - "8081:8081"

  service-finances:
    ports:
      - "8082:8082"

  service-banks:
    ports:
      - "8083:8083"

  service-notifications:
    ports:
      - "8084:8084"

  service-upload:
    ports:
      - "8085:8085"

  service-investments:
    ports:
      - "8086:8086"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3001:3000"

  loki:
    ports:
      - "3100:3100"
